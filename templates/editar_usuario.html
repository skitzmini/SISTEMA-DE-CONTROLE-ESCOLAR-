{% extends 'base.html' %}{% block heading %}Editar usuário{% endblock %}{% block content %}<div class="form-card narrow"><h2>{{ usuario.nome }}</h2><p>Perfil: {{ usuario.perfil|capitalize }}. A senha só é alterada se uma nova for informada.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="nome" value="{{ usuario.nome }}" required></label><label>E-mail<input type="email" name="email" value="{{ usuario.email }}" required></label>{% if usuario.aluno %}<label>Matrícula<input name="matricula" value="{{ usuario.aluno.matricula }}" required></label>{% endif %}{% if usuario.professor %}<label>Registro funcional<input name="registro" value="{{ usuario.professor.registro or '' }}"></label>{% endif %}<label>Nova senha <small>(opcional, mínimo 8 caracteres)</small><input type="password" name="senha" minlength="8"></label><label>Acesso<select name="ativo"><option value="sim" {% if usuario.ativo %}selected{% endif %}>Ativo</option><option value="nao" {% if not usuario.ativo %}selected{% endif %}>Desativado</option></select></label><div class="form-actions"><a class="text-link" href="{{ url_for('cadastros') }}">Cancelar</a><button class="button primary">Salvar alterações</button></div></form></div>{% endblock %}
